<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winter School Scrolling Readers Smoke Test</title>
  <style>
    body {
      background: #111;
      color: #f5f5f5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin: 0;
      padding: 16px;
    }

    iframe {
      border: 0;
      height: 800px;
    }

    pre {
      line-height: 1.45;
      margin: 0 0 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body data-test-status="RUNNING">
  <pre id="log">Running...</pre>
  <iframe id="frame" title="Page under test"></iframe>
  <script>
    const frame = document.querySelector('#frame');
    const logElement = document.querySelector('#log');
    const results = [];
    const params = new URLSearchParams(window.location.search);
    const frameWidth = Number(params.get('width') || '1280');
    frame.style.width = `${frameWidth}px`;

    const notes = [
      { slug: 'common-crawl', pages: 1, pdf: '/CommonCrawl.pdf' },
      { slug: 'factuality', pages: 121, pdf: '/fact.pdf' },
      { slug: 'fineweb2', pages: 74, pdf: '/fine.pdf' },
      { slug: 'scaling-laws', pages: 100, pdf: '/jenia.pdf' },
      { slug: 'generalization', pages: 21, pdf: '/maria.pdf' }
    ];

    function log(message) {
      results.push(message);
      logElement.textContent = results.join('\n');
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
      log(`PASS ${message}`);
    }

    function loadFrame(path) {
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error(`Timed out loading ${path}`)), 15000);
        frame.addEventListener('load', () => {
          clearTimeout(timeout);
          resolve();
        }, { once: true });
        frame.src = path;
      });
    }

    async function checkLanding() {
      await loadFrame('/posts/hplt-nlpl-winter-school/');
      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      assert(doc.querySelectorAll('[data-note-reader]').length === notes.length, 'landing page exposes all five scrolling readers');
      assert(!doc.querySelector('iframe, object, embed'), 'landing page has no nested PDF viewport');

      for (const note of notes) {
        const card = doc.querySelector(`[data-note-reader="${note.slug}"]`);
        const open = doc.querySelector(`[data-note-open="${note.slug}"]`);
        const download = doc.querySelector(`[data-note-download="${note.slug}"]`);
        const readerPath = `/posts/hplt-nlpl-winter-school/read/${note.slug}/`;

        assert(Boolean(card && open && download), `${note.slug} exposes reader and download actions`);
        assert(open.getAttribute('href') === readerPath, `${note.slug} opens an HTML reader route`);
        assert(open.target === '_blank' && open.relList.contains('noopener'), `${note.slug} reader opens safely in a new tab`);
        assert(download.getAttribute('href') === note.pdf && download.hasAttribute('download'), `${note.slug} retains a direct PDF download`);
      }

      assert(doc.scrollingElement.scrollWidth <= win.innerWidth + 1, `landing page has no horizontal overflow at ${frameWidth}px`);
    }

    async function checkReader(note) {
      await loadFrame(`/posts/hplt-nlpl-winter-school/read/${note.slug}/`);
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      const pages = Array.from(doc.querySelectorAll('[data-note-page]'));
      const images = pages.map((page) => page.querySelector('img'));
      const download = doc.querySelector(`[data-note-download="${note.slug}"]`);
      const boundedElements = [
        doc.querySelector('.ws-reader-back'),
        doc.querySelector('.ws-reader-heading'),
        download,
        doc.querySelector('.ws-reader-summary'),
        images[0]
      ];

      assert(Boolean(doc.querySelector('main') && doc.querySelector('h1')), `${note.slug} reader has main and title landmarks`);
      assert(Boolean(doc.querySelector('.ws-reader-summary')), `${note.slug} reader includes a crawlable summary`);
      assert(pages.length === note.pages, `${note.slug} reader contains all ${note.pages} pages`);
      assert(images.every(Boolean), `${note.slug} reader represents every page with an image`);
      assert(images.every((image) => image.getAttribute('src').endsWith('.jpg')), `${note.slug} reader uses browser-safe JPEG pages`);
      assert(images.every((image) => image.width > 0 && image.height > 0), `${note.slug} pages reserve intrinsic aspect ratios`);
      assert(new Set(images.map((image) => image.alt)).size === note.pages, `${note.slug} pages have unique accessible names`);
      assert(images.slice(1).every((image) => image.loading === 'lazy'), `${note.slug} defers off-screen page images`);
      assert(images[0].complete && images[0].naturalWidth > 0, `${note.slug} loads its first page`);
      assert(download.getAttribute('href') === note.pdf && download.hasAttribute('download'), `${note.slug} keeps the original PDF download`);
      assert(!doc.querySelector('iframe, object, embed'), `${note.slug} has no nested PDF viewport`);
      assert(win.getComputedStyle(doc.querySelector('.ws-reader-bar')).position === 'fixed', `${note.slug} keeps reader controls visible while scrolling`);

      const tops = pages.map((page) => page.offsetTop);
      assert(tops.every((top, index) => index === 0 || top > tops[index - 1]), `${note.slug} pages flow in continuous document order`);
      assert(doc.scrollingElement.scrollHeight > win.innerHeight, `${note.slug} scrolls with the document`);
      assert(doc.scrollingElement.scrollWidth <= win.innerWidth + 1, `${note.slug} has no horizontal overflow at ${frameWidth}px`);
      assert(boundedElements.every((element) => {
        const rect = element.getBoundingClientRect();
        return rect.left >= -1 && rect.right <= win.innerWidth + 1;
      }), `${note.slug} controls and first page fit inside the ${frameWidth}px viewport`);
    }

    async function run() {
      await checkLanding();
      for (const note of notes) {
        await checkReader(note);
      }
      log(`PASS winter-school reader smoke test completed at ${frameWidth}px`);
      document.body.dataset.testStatus = 'PASS';
    }

    run().catch((error) => {
      log(`FAIL ${error.message}`);
      document.body.dataset.testStatus = 'FAIL';
    });
  </script>
</body>
</html>
