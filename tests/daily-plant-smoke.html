<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily plant smoke test</title>
  <style>
    body {
      background: #111;
      color: #f5f5f5;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin: 0;
      padding: 16px;
    }

    #log {
      margin: 0 0 16px;
      white-space: pre-wrap;
    }

    #fixtures {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    iframe {
      background: #f4f0e7;
      border: 0;
      height: 480px;
      width: 380px;
    }
  </style>
</head>
<body data-test-status="RUNNING">
  <pre id="log">Running...</pre>
  <div id="fixtures"></div>
  <script>
    const logElement = document.querySelector('#log');
    const results = [];
    const geometrySelector = 'path, line, polyline, polygon, circle, ellipse, rect';
    const geometryAttributes = [
      'd', 'points', 'x', 'y', 'x1', 'y1', 'x2', 'y2',
      'cx', 'cy', 'r', 'rx', 'ry', 'width', 'height', 'transform'
    ];

    function log(message) {
      results.push(message);
      logElement.textContent = results.join('\n');
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      log(`PASS ${message}`);
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function loadPlant(instant, reducedMotion = true) {
      return new Promise((resolve, reject) => {
        const frame = document.createElement('iframe');
        frame.title = `Daily plant at ${instant}, reduced motion ${reducedMotion}`;
        const timeout = setTimeout(() => reject(new Error(`Timed out loading ${instant}`)), 10000);
        frame.addEventListener('load', async () => {
          clearTimeout(timeout);
          await sleep(50);
          resolve({ frame, doc: frame.contentDocument, win: frame.contentWindow });
        }, { once: true });
        frame.srcdoc = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <base href="/">
            <link rel="stylesheet" href="/assets/css/site-theme.css">
            <link rel="stylesheet" href="/assets/css/daily-plant.css">
            <script>
              window.__plantErrors = [];
              addEventListener('error', (event) => {
                window.__plantErrors.push(event.message || 'Failed to load ' + (event.target.src || event.target.href));
              }, true);
              addEventListener('unhandledrejection', (event) => {
                window.__plantErrors.push(String(event.reason));
              });
              const NativeDate = Date;
              window.__plantClock = NativeDate.parse(${JSON.stringify(instant)});
              window.Date = class extends NativeDate {
                constructor(...args) {
                  super(...(args.length ? args : [window.__plantClock]));
                }
                static now() { return window.__plantClock; }
              };
              const nativeMatchMedia = window.matchMedia.bind(window);
              window.matchMedia = (query) => {
                if (!query.includes('prefers-reduced-motion')) return nativeMatchMedia(query);
                return {
                  matches: ${reducedMotion}, media: query, onchange: null,
                  addListener() {}, removeListener() {},
                  addEventListener() {}, removeEventListener() {},
                  dispatchEvent() { return true; }
                };
              };
            <\/script>
          </head>
          <body>
            <section class="daily-plant" data-daily-plant>
              <svg class="daily-plant__art" data-plant-art viewBox="0 0 320 300" role="img" aria-labelledby="daily-plant-art-title daily-plant-art-desc">
                <title id="daily-plant-art-title">Today's mathematical plant</title>
                <desc id="daily-plant-art-desc">An imaginary plant grown from branching rules.</desc>
              </svg>
              <time data-plant-date></time>
              <span class="daily-plant__name" data-plant-name></span>
              <button class="daily-plant__replay" type="button" data-plant-replay hidden>Watch it grow</button>
            </section>
            <script src="/assets/js/daily-plant.js" defer><\/script>
          </body>
          </html>`;
        document.querySelector('#fixtures').append(frame);
      });
    }

    function renderedShapes(svg) {
      return Array.from(svg.querySelectorAll(geometrySelector)).filter((element) =>
        !element.closest('defs, clipPath, mask, marker, pattern')
      );
    }

    function geometry(svg) {
      return JSON.stringify(Array.from(svg.querySelectorAll(`g, ${geometrySelector}`)).map((element) => [
        element.localName,
        ...geometryAttributes.map((attribute) => element.getAttribute(attribute))
      ]));
    }

    function checkPlant(fixture, expectedDate) {
      const { doc, win } = fixture;
      const svg = doc.querySelector('[data-plant-art]');
      const date = doc.querySelector('[data-plant-date]');
      const name = doc.querySelector('[data-plant-name]');
      const replay = doc.querySelector('[data-plant-replay]');
      const shapes = renderedShapes(svg);
      const labelIds = (svg.getAttribute('aria-labelledby') || '').trim().split(/\s+/);

      assert(win.__plantErrors.length === 0, `${expectedDate} renders without runtime or asset errors`);
      assert(labelIds.length === 2 && labelIds.every((id) => {
        const label = doc.getElementById(id);
        return label && svg.contains(label) && label.textContent.trim().length > 0;
      }), `${expectedDate} preserves accessible title and description references after generating the plant`);
      assert(date.dateTime === expectedDate && date.textContent.trim().length > 0,
        `${expectedDate} has the expected Rome calendar date and a visible date label`);
      assert(name.textContent.trim().length > 0, `${expectedDate} has a plant name`);
      assert(shapes.length > 0, `${expectedDate} generates SVG geometry`);
      assert(shapes.every((element) => geometryAttributes.every((attribute) => {
        const value = element.getAttribute(attribute);
        if (value === null) return true;
        if (/NaN|Infinity|undefined/.test(value)) return false;
        const numbers = value.match(/[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:e[-+]?\d+)?/gi) || [];
        return numbers.every((number) => Number.isFinite(Number(number)));
      })), `${expectedDate} has finite geometry coordinates`);

      const box = svg.getBBox();
      const view = svg.viewBox.baseVal;
      assert([box.x, box.y, box.width, box.height].every(Number.isFinite) && box.width > 0 && box.height > 0,
        `${expectedDate} has a nonempty finite drawing`);
      assert(box.x >= view.x && box.y >= view.y &&
        box.x + box.width <= view.x + view.width && box.y + box.height <= view.y + view.height,
        `${expectedDate} stays inside the SVG viewBox`);
      assert(replay.hidden === win.matchMedia('(prefers-reduced-motion: reduce)').matches && !replay.disabled,
        `${expectedDate} offers replay when motion is enabled`);
      return geometry(svg);
    }

    function isVisible(element, win) {
      for (let current = element; current && current.nodeType === 1; current = current.parentElement) {
        const style = win.getComputedStyle(current);
        if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) return false;
      }
      const rect = element.getBoundingClientRect();
      return rect.width > 0 || rect.height > 0;
    }

    async function run() {
      const initial = await loadPlant('2026-11-05T12:00:00Z');
      const firstGeometry = checkPlant(initial, '2026-11-05');
      const repeat = await loadPlant('2026-11-05T20:00:00Z');
      assert(checkPlant(repeat, '2026-11-05') === firstGeometry,
        'the same Rome day produces identical geometry across independent page loads');

      const nextDay = await loadPlant('2026-11-06T12:00:00Z');
      assert(checkPlant(nextDay, '2026-11-06') !== firstGeometry,
        'consecutive Rome dates produce different plants');

      const winterBefore = await loadPlant('2026-11-05T22:59:59Z');
      const winterAfter = await loadPlant('2026-11-05T23:00:01Z');
      assert(checkPlant(winterBefore, '2026-11-05') === firstGeometry,
        'winter keeps the current plant until midnight in Rome');
      assert(checkPlant(winterAfter, '2026-11-06') === geometry(nextDay.doc.querySelector('[data-plant-art]')),
        'winter changes the plant at Rome midnight before the UTC date changes');

      const summerBefore = await loadPlant('2026-07-05T21:59:59Z');
      const summerAfter = await loadPlant('2026-07-05T22:00:01Z');
      assert(checkPlant(summerBefore, '2026-07-05') !== checkPlant(summerAfter, '2026-07-06'),
        'summer daylight saving time moves the Rome day boundary to 22:00 UTC');

      const reducedSvg = initial.doc.querySelector('[data-plant-art]');
      assert(renderedShapes(reducedSvg).every((shape) => isVisible(shape, initial.win)),
        'reduced motion shows the completed plant immediately');
      assert(reducedSvg.getAnimations({ subtree: true }).length === 0,
        'reduced motion starts no growth animations');
      initial.doc.querySelector('[data-plant-replay]').click();
      await sleep(50);
      assert(geometry(reducedSvg) === firstGeometry &&
        renderedShapes(reducedSvg).every((shape) => isVisible(shape, initial.win)) &&
        reducedSvg.getAnimations({ subtree: true }).length === 0,
        'replay keeps reduced-motion geometry visible and unchanged');

      const animated = await loadPlant('2026-11-05T12:00:00Z', false);
      const animatedGeometry = checkPlant(animated, '2026-11-05');
      animated.doc.querySelector('[data-plant-replay]').click();
      await sleep(50);
      assert(geometry(animated.doc.querySelector('[data-plant-art]')) === animatedGeometry,
        'replaying growth preserves the daily plant geometry');
      assert(animated.win.__plantErrors.length === 0, 'replay causes no runtime errors');

      assert(!initial.doc.hidden, 'the live rollover fixture is visible');
      initial.win.__plantClock = Date.parse('2026-11-05T23:00:01Z');
      initial.doc.dispatchEvent(new initial.win.Event('visibilitychange'));
      await sleep(50);
      const updatedGeometry = checkPlant(initial, '2026-11-06');
      assert(initial.frame.contentDocument === initial.doc && updatedGeometry !== firstGeometry &&
        updatedGeometry === geometry(nextDay.doc.querySelector('[data-plant-art]')),
        'returning to a page after Rome midnight updates the plant without reloading');

      document.body.dataset.testStatus = 'PASS';
      log('PASS Daily plant smoke test completed.');
    }

    run().catch((error) => {
      log(`FAIL ${error.message}`);
      document.body.dataset.testStatus = 'FAIL';
    });
  </script>
</body>
</html>
